{% extends "layout.html" %}

{% block title %}403 Access Forbidden - Hotel Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-6 text-center">
        <div class="p-5 bg-white rounded-4 shadow-sm">
            <i class="fa-solid fa-user-lock fa-4x text-danger mb-3"></i>
            <h1 class="fw-bold font-outfit text-dark display-5">403</h1>
            <h4 class="fw-semibold text-secondary mb-3">Access Restricted</h4>
            <p class="text-muted mb-4">You do not have permission to access this administrative resource. Your role limits view access.</p>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary rounded-pill px-4">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
